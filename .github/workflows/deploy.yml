name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless --no-progress

      - name: Build Angular app
        # A projekt a /ancient-chronicles/ alútvonalon fut, ezért minden saját hivatkozás
        # (képek, háttérképek, zenék) a base href-hez képest relatív.
        run: npx ng build --configuration production --base-href "/ancient-chronicles/"

      - name: Static copies for every route (HTTP 200 for deep links) + 404 fallback
        run: node scripts/spa-routes.mjs dist/ancient-chronicles/browser

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist/ancient-chronicles/browser
          force_orphan: true
